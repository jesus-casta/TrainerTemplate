spring.application.name=TrainerTemplate
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/trainer}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
trainer.username=${TRAINER_USERNAME:trainer}
trainer.password=${TRAINER_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
