<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrainerTemplate</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<aside><a class="brand" href="#">T<span>TrainerTemplate<small>ENTRENA CON CRITERIO</small></span></a><nav><button data-view="today" class="selected">◉ Hoy</button><button data-view="programs">▤ Programación</button><button data-view="exercises">◇ Ejercicios</button><button data-view="calendar">▦ Calendario</button><button data-view="progress">↗ Progreso</button></nav><div class="aside-bottom">VERSIÓN 0.1<br>Tu programa. Tu evolución.</div></aside>
<main><header><div><span class="eyebrow">ESPACIO DE ENTRENAMIENTO</span><h1 id="title">Tu próximo entrenamiento</h1></div><button id="export" class="secondary">Exportar datos</button></header><div id="notice" role="status" hidden></div><section id="login" class="card"><h2>Accede a tu entrenamiento</h2><p>Usa las credenciales configuradas en tu servidor.</p><form id="login-form"><label>Usuario<input name="user" value="trainer" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><div id="content" hidden></div></main>
<dialog id="editor"><form id="editor-form"><div class="dialog-top"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="secondary">Cerrar</button></div><div id="editor-fields"></div><button>Guardar</button></form></dialog></body></html>
